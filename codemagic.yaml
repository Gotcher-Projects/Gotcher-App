workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    integrations:
      app_store_connect: CradleHQ
    environment:
      node: 24
      xcode: latest
      vars:
        # Numeric App Store Connect Apple ID — App Store Connect → your app → App Information → "Apple ID".
        # Used to fetch the latest uploaded build number so each build auto-increments.
        APP_APPLE_ID: "REPLACE_WITH_YOUR_NUMERIC_APPLE_ID"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gotcherapp.cradlehq
    scripts:
      - name: Install dependencies
        script: cd Frontend && npm ci
      - name: Build web assets
        script: cd Frontend && npm run build
      - name: Capacitor sync
        script: cd Frontend && npx cap sync ios
      - name: Auto-increment build number
        script: |
          cd Frontend/ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID")
          NEW=$((LATEST + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW;/g" App.xcodeproj/project.pbxproj
          echo "Set CURRENT_PROJECT_VERSION to $NEW (latest uploaded was $LATEST)"
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          cd Frontend/ios/App
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd Frontend/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=RBPKGNW4K6 \
            -skipPackageSignatureValidation \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/output
    artifacts:
      - Frontend/ios/App/build/output/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
