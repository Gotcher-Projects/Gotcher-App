workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    integrations:
      app_store_connect: CradleHQ
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gotcherapp.cradlehq
    scripts:
      - name: Install dependencies
        script: cd Frontend && npm ci
      - name: Build web assets
        script: cd Frontend && npm run build
      - name: Capacitor sync
        script: cd Frontend && npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          cd Frontend/ios/App
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd Frontend/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=RBPKGNW4K6 \
            -skipPackageSignatureValidation \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/output
    artifacts:
      - Frontend/ios/App/build/output/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
