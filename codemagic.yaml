workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    integrations:
      app_store_connect: CradleHQ
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: cd Frontend && npm ci
      - name: Build web assets
        script: cd Frontend && npm run build
      - name: Capacitor sync
        script: cd Frontend && npx cap sync ios
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files com.gotcherapp.cradlehq \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd Frontend/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/output
    artifacts:
      - Frontend/ios/App/build/output/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
