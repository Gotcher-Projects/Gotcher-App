workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    integrations:
      app_store_connect: CradleHQ
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: cd Frontend && npm ci
      - name: Build web assets
        script: cd Frontend && npm run build
      - name: Capacitor sync
        script: cd Frontend && npx cap sync ios
      - name: Set up code signing
        script: |
          echo "=== Fetching signing files ==="
          app-store-connect fetch-signing-files com.gotcherapp.cradlehq \
            --type IOS_APP_STORE \
            --create \
            --verbose
          echo "=== Profiles downloaded ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>&1 || echo "No profiles found"
          keychain initialize
          keychain add-certificates
          cd Frontend/ios/App
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd Frontend/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          echo "Using profile UUID: $PROFILE_UUID"
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=RBPKGNW4K6 \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            -skipPackageSignatureValidation \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/output
    artifacts:
      - Frontend/ios/App/build/output/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
