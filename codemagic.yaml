workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    integrations:
      app_store_connect: CradleHQ
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: cd Frontend && npm ci
      - name: Build web assets
        script: cd Frontend && npm run build
      - name: Capacitor sync
        script: cd Frontend && npx cap sync ios
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files com.gotcherapp.cradlehq \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          cd Frontend/ios/App
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd Frontend/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=RBPKGNW4K6 \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/output
    artifacts:
      - Frontend/ios/App/build/output/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
