services:
  caddy:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${APP_DOMAIN}/api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    depends_on:
      - api

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "4"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: gotcherapp
      PGUSER: gotcherapp_app
      PGPASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://${APP_DOMAIN}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Claude / Anthropic — the ✨ AI-assist. Must be passed through explicitly (no env_file here), else
      # anthropic.api.key defaults blank in-container and every AI-assist call fails regardless of user credits.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_TEMPERATURE: ${ANTHROPIC_TEMPERATURE:-0.3}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@cradlehq.app}
      BACKEND_URL: https://${APP_DOMAIN}/api
      CORS_ORIGINS: https://${APP_DOMAIN},http://localhost,https://localhost,capacitor://localhost
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      FREE_GRANT_LIMIT: ${FREE_GRANT_LIMIT:-500}
      FREE_GRANT_SIZE: ${FREE_GRANT_SIZE:-5}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_CREDITS_50: ${STRIPE_PRICE_CREDITS_50:-}
      STRIPE_PRICE_CREDITS_125: ${STRIPE_PRICE_CREDITS_125:-}
      STRIPE_PRICE_BUNDLE_SHARE_150: ${STRIPE_PRICE_BUNDLE_SHARE_150:-}
      STRIPE_PRICE_SHARE_ONLY: ${STRIPE_PRICE_SHARE_ONLY:-}
      # Print / Lulu (pr5) — ships dormant: PRINT_ENABLED defaults OFF, real Lulu creds swap in at pr10.
      PRINT_ENABLED: ${PRINT_ENABLED:-false}
      LULU_API_BASE: ${LULU_API_BASE:-}
      LULU_CLIENT_ID: ${LULU_CLIENT_ID:-}
      LULU_CLIENT_SECRET: ${LULU_CLIENT_SECRET:-}
      LULU_POD_PACKAGE_ID: ${LULU_POD_PACKAGE_ID:-}
      # Print render/TTL knobs — dormant tonight but forward them so a pr10 .env override actually reaches
      # the container (same passthrough trap that blanked ANTHROPIC_API_KEY). Defaults match application.properties.
      PRINT_RENDER_TIMEOUT_MS: ${PRINT_RENDER_TIMEOUT_MS:-120000}
      PRINT_PDF_TTL_HOURS: ${PRINT_PDF_TTL_HOURS:-24}
      # PDF sidecar (headless Chrome) — reachable over the compose network at the service name.
      # Chrome loads the print route from the public frontend served by Caddy.
      PRINT_SIDECAR_URL: http://pdf-sidecar:4000
      PRINT_FRONTEND_BASE: https://${APP_DOMAIN}
      PRINT_OPERATOR_EMAIL: ${PRINT_OPERATOR_EMAIL:-print@cradlehq.app}
    depends_on:
      postgres:
        condition: service_healthy
      pdf-sidecar:
        condition: service_started

  # Print PDF renderer (pr1) — Debian + Chromium; only the api talks to it, over the compose network.
  # No host port: it must not be reachable from the internet. Ships alongside print (dormant until pr10).
  pdf-sidecar:
    build:
      context: ./pdf-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gotcherapp
      POSTGRES_USER: gotcherapp_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotcherapp_app -d gotcherapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
