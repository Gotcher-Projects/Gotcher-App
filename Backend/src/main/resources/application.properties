# Server
server.port=${PORT:3001}


# Database
spring.datasource.url=jdbc:postgresql://${PGHOST:127.0.0.1}:${PGPORT:5432}/${PGDATABASE:gotcherapp}
spring.datasource.username=${PGUSER:gotcherapp_app}
spring.datasource.password=${PGPASSWORD:changeme_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway — reads migration files from Backend/db/migration/ (relative to working directory)
spring.flyway.locations=filesystem:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# V7 was added as a placeholder after V8 was already applied to existing DBs; out-of-order
# lets Flyway apply it retroactively without blocking startup.
spring.flyway.out-of-order=true

# JWT
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-32c}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# CORS — comma-separated list; include Capacitor origins for mobile app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost,https://localhost,capacitor://localhost}

# Disable Spring Security's default login page banner
spring.security.user.name=disabled
spring.security.user.password=disabled

# Mail (optional — email features silently disabled when SMTP_HOST is blank)
# Configure via env vars: SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD
# See Backend/.env.example for setup instructions (Gmail / Resend / Mailtrap)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.smtp.from=${SMTP_FROM:noreply@cradlehq.app}

# App URLs
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.backend-url=${BACKEND_URL:http://localhost:3001}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Cookies — set SECURE_COOKIES=true in production (requires HTTPS / Caddy TLS termination)
app.cookies.secure=${SECURE_COOKIES:false}

# Admin — set ADMIN_SECRET to a long random string; required for DELETE /admin/account
app.admin.secret=${ADMIN_SECRET:}

# Actuator — expose health endpoint for reverse proxy / container health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Free signup credit grant (sv2-grant) — first N signups get SIZE credits, then grants stop.
# Env-driven so tuning N never requires a migration. Set FREE_GRANT_LIMIT=0 to switch grants off.
app.free-grant.limit=${FREE_GRANT_LIMIT:500}
app.free-grant.size=${FREE_GRANT_SIZE:5}

# Anthropic / Claude
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
anthropic.temperature=${ANTHROPIC_TEMPERATURE:0.3}

# Print (pr3) — headless-Chrome PDF pipeline (pr1 sidecar + pr2 route).
#  sidecar-url:    where the backend POSTs /render (dev: host:4000; prod: the pdf-sidecar service, set in pr10).
#  frontend-base:  the URL the sidecar's Chrome loads the print route from (dev: :3000; prod: https://cradlehq.app).
#  The Lulu-facing PDF fetch URL is built from app.backend-url (prod: https://cradlehq.app/api).
app.print.sidecar-url=${PRINT_SIDECAR_URL:http://localhost:4000}
app.print.frontend-base=${PRINT_FRONTEND_BASE:http://localhost:3000}
app.print.render-timeout-ms=${PRINT_RENDER_TIMEOUT_MS:120000}
app.print.pdf-ttl-hours=${PRINT_PDF_TTL_HOURS:24}

# Print kill switch (pr5) — the whole Lulu/print feature ships live but DORMANT behind this one flag so it can
# be turned off fast without a redeploy. Default OFF: prod ships with print disabled; flip PRINT_ENABLED=true
# only after launch verification (pr10). The Lulu client HARD-REFUSES submitting a paid print job when this is
# false (deepest backstop; pr7/pr8 add earlier gates). Dev: set PRINT_ENABLED=true in Backend/.env to exercise
# pr5–pr9 locally. Pure kill switch — off means "refuse NEW submissions", it does not cancel in-flight jobs (s14a).
app.print.enabled=${PRINT_ENABLED:false}

# Print operator alerts (s14a-1) — where "a PAID order needs a human" mail goes: a Lulu rejection after the
# charge, or an order stuck unsubmitted. NOT the customer; refunds are issued by hand from the Stripe dashboard
# (decision D2, no unattended auto-refund). ⚠ EmailService silently no-ops when SMTP isn't configured, so these
# alerts are invisible until pr10 proves outbound mail actually sends in prod.
app.print.operator-email=${PRINT_OPERATOR_EMAIL:print@cradlehq.app}

# Lulu Print API (pr5) — print-on-demand vendor. Sandbox first (api.sandbox.lulu.com); prod base + creds swap
# in at pr10 (like Stripe test→live). Blank creds so the app boots without print configured; base defaults to
# sandbox. Creds live in Backend/.env only — never commit secrets. lulu-verify.sh reads the same LULU_* vars.
# ⚠ lulu.client-secret is ALSO the HMAC key for the status webhook (s14a-1) — rotating it invalidates in-flight
# webhook deliveries as well as the OAuth creds.
lulu.api-base=${LULU_API_BASE:https://api.sandbox.lulu.com}
lulu.client-id=${LULU_CLIENT_ID:}
lulu.client-secret=${LULU_CLIENT_SECRET:}
lulu.pod-package-id=${LULU_POD_PACKAGE_ID:}

# Stripe — one-time SKUs (NOT subscriptions). Blank defaults so the app boots without billing configured.
# Use sk_test_/whsec_ + test price ids locally; live values are swapped in at P12. Never commit real keys.
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.credits50=${STRIPE_PRICE_CREDITS_50:}
stripe.price.credits125=${STRIPE_PRICE_CREDITS_125:}
stripe.price.bundleShare150=${STRIPE_PRICE_BUNDLE_SHARE_150:}
stripe.price.shareOnly=${STRIPE_PRICE_SHARE_ONLY:}
